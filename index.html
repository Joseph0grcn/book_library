<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitap Kütüphanem</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="auth-gate" class="auth-gate">
    <div class="auth-panel">
      <p class="eyebrow">KİŞİSEL KOLEKSİYON</p>
      <h1>Kitap Kütüphanem</h1>
      <p class="intro">Kütüphanene erişmek için giriş yap veya yeni hesap oluştur.</p>
      <form id="auth-form">
        <input id="auth-email" type="email" placeholder="E-posta" autocomplete="email" required />
        <input id="auth-password" type="password" placeholder="Şifre" autocomplete="current-password" minlength="6" required />
        <button type="submit" id="auth-login">Giriş yap</button>
        <button type="button" id="auth-register" class="secondary">Hesap oluştur</button>
      </form>
      <p id="auth-status" class="status"></p>
    </div>
  </section>
  <div id="app">
    <header>
      <div>
        <p class="eyebrow">KİŞİSEL KOLEKSİYON</p>
        <h1>Kitap Kütüphanem</h1>
        <p class="intro">Koleksiyonunu tek yerde keşfet, takip et ve büyüt.</p>
      </div>
      <button type="button" id="auth-logout" class="secondary small">Çıkış yap</button>
      <div class="library-stats" aria-label="Kütüphane özeti">
        <span class="stats-label">KOLEKSİYON</span>
        <strong id="book-count">0</strong>
        <span>kitap</span>
      </div>
    </header>

    <section class="controls">
      <div class="mode-switch">
        <button type="button" id="mode-manual" class="mode active">Manuel</button>
        <button type="button" id="mode-isbn" class="mode secondary">ISBN / Barkod</button>
      </div>

      <form id="book-form">
        <div id="manual-fields" class="entry-panel">
          <input id="title" type="text" placeholder="Başlık" />
          <input id="author" type="text" placeholder="Yazar" />
          <input id="year" type="number" placeholder="Yıl" min="0" />
          <input id="tags" type="text" placeholder="Etiketler (virgülle ayrılmış)" />
        </div>

        <div id="isbn-fields" class="entry-panel hidden">
          <input id="isbn-input" type="text" placeholder="ISBN veya barkod girin" />
          <button type="button" id="lookup-book" class="secondary">Bilgiyi Getir</button>
          <button type="button" id="scan-camera" class="secondary">Kamera ile Tara</button>
        </div>

        <div class="reading-tools">
          <select id="reading-status" aria-label="Okuma durumu">
            <option value="unread">Okunacak</option>
            <option value="reading">Okunuyor</option>
            <option value="read">Okundu</option>
          </select>
          <label class="progress-control">
            <span>İlerleme <output id="progress-value">0%</output></span>
            <input id="progress" type="range" min="0" max="100" step="5" value="0" />
          </label>
          <select id="rating" aria-label="Kitap puanı">
            <option value="0">Puan yok</option>
            <option value="1">1 / 5</option>
            <option value="2">2 / 5</option>
            <option value="3">3 / 5</option>
            <option value="4">4 / 5</option>
            <option value="5">5 / 5</option>
          </select>
        </div>
        <div class="personal-fields">
          <textarea id="review" placeholder="Kısa yorum (isteğe bağlı)"></textarea>
          <textarea id="notes" placeholder="Notlar ve alıntılar (isteğe bağlı)"></textarea>
        </div>
        <button type="submit" id="save-book">Kitabı Kaydet</button>
      </form>

      <div class="filters">
        <input id="search" type="search" placeholder="Ara başlık veya yazar..." />
        <select id="filter">
          <option value="all">Hepsi</option>
          <option value="read">Okunanlar</option>
          <option value="unread">Okunmayanlar</option>
        </select>
        <select id="status-filter" aria-label="Okuma durumu filtresi">
          <option value="all">Tüm durumlar</option>
          <option value="unread">Okunacak</option>
          <option value="reading">Okunuyor</option>
          <option value="read">Okundu</option>
        </select>
        <select id="rating-filter" aria-label="Puan filtresi">
          <option value="all">Tüm puanlar</option>
          <option value="5">5 puan</option>
          <option value="4">4+ puan</option>
          <option value="3">3+ puan</option>
        </select>
        <button id="backup" class="secondary">Yedek Al</button>
        <button id="export" class="secondary">JSON Dışa Aktar</button>
        <button id="save-db" class="secondary">db.json Olarak Kaydet</button>
        <input id="import-file" type="file" accept="application/json" hidden />
        <button id="import" class="secondary">İçe Aktar</button>
        <button id="clear" class="danger">Tümünü Sil</button>
      </div>
    </section>

    <section id="book-detail" class="book-detail hidden">
      <button type="button" id="back-to-library" class="secondary">Kütüphaneye dön</button>
      <div id="book-detail-content"></div>
    </section>

    <section class="dashboard-stats" aria-label="Kütüphane istatistikleri">
      <div><strong id="stat-total">0</strong><span>Toplam</span></div>
      <div><strong id="stat-reading">0</strong><span>Okunuyor</span></div>
      <div><strong id="stat-read">0</strong><span>Okundu</span></div>
      <div><strong id="stat-progress">0%</strong><span>Ortalama ilerleme</span></div>
    </section>

    <div id="scanner-modal" class="scanner-modal hidden">
      <div class="scanner-window">
        <div class="scanner-header">
          <strong>Barkod / ISBN tara</strong>
          <button type="button" id="close-scanner" class="secondary small">Kapat</button>
        </div>
        <div class="scanner-modes">
          <label class="checkbox">
            <input type="checkbox" id="scan-barcode" checked />
            <span>Barkod oku</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" id="scan-printed-isbn" />
            <span>Yazılı ISBN oku</span>
          </label>
        </div>
        <video id="scanner-video" autoplay playsinline muted></video>
        <div class="scanner-actions">
          <button type="button" id="read-printed-isbn" class="secondary">Seçili yöntemi çalıştır</button>
        </div>
      </div>
    </div>

    <section id="status" class="status"></section>
    <section id="list" class="list"></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
